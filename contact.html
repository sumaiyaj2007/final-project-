        }

        .line {
            width: 150px;
            height: 4px;
            background-color: #08c5e9;
            margin: 15px auto;
        }

        .contact-form {
            max-width: 600px;
            margin: 40px auto;
        }

        footer {
            background-color: #f2f2f2;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
   <header class="container-fluid bg-primary">
    <nav class="navbar navbar-expand bg-body-danger">

      <div class="container bg-tertiary">
        <a class="navbar-brand" href="#">
          <img src="image/logo.png" alt="logo" width="60" height="50" >
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <nav>
        <div class="container">
        <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link mx-2" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link mx-2" href="myself.html">MyPortfolio</a>
                    </li>
                    <li class="nav-item dropdown">

                            <a class="nav-link dropdown-toggle"
                                href="#"
                                role="button"
                                data-bs-toggle="dropdown">
                                About Us
                            </a>

                            <ul class="dropdown-menu">

                                <li><a class="dropdown-item" href="#">Education</a></li>
                                <li><a class="dropdown-item" href="#">Health</a></li>
                                <li><a class="dropdown-item" href="#">Disability</a></li>

                            </ul>

                    <li class="nav-item">

            </div>
        </div>
    </nav>
      </div>
    </nav>
  </header>

    <!-- Contact Heading -->
    <section class="contact-section">
        <h1>Contact Us</h1>
        <div class="line"></div>
        <p>We would love to hear from you!</p>
    </section>

    <!-- Contact Form -->
    <section class="container">
        <div class="contact-form">

            <h2 class="text-center mb-4">Get In Touch</h2>

            <form>
                <div class="mb-3">
                    <label class="form-label">Your Name</label>
                    <input type="text" class="form-control"
                           placeholder="Enter your name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Your Email</label>
                    <input type="email" class="form-control"
                           placeholder="Enter your email" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Subject</label>
                    <input type="text" class="form-control"
                           placeholder="Enter subject" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Your Message</label>
                    <textarea class="form-control" rows="5"
                              placeholder="Write your message..." required></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Send Message
                </button>
            </form>

        </div>
    </section>

    <!-- Footer -->
