
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us - Children's Hope</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        /* General Styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Navbar */
        .navbar {
            background-color: #1670f9;
        }

        .navbar-brand img {
            width: 60px;
            height: auto;
        }

        .navbar .nav-link {
            color: white !important;
            font-weight: 500;
            padding: 12px 15px;
        }

        .navbar .nav-link:hover {
            color: #dceaff !important;
        }

        /* Dropdown */
        .navbar .dropdown-menu {
            background-color: white;
            border: none;
        }

        .navbar .dropdown-item {
            color: black;
        }

        .navbar .dropdown-item:hover {
            background-color: #e9f2ff;
            color: #1670f9;
        }

        /* Navbar Toggle */
        .navbar-toggler {
            border-color: white;
        }

        .navbar-toggler-icon {
            filter: brightness(0) invert(1);
        }

        /* Contact Heading */
        .contact-section {
            background-color: #f1f8ff;
            padding: 60px 20px;
            text-align: center;
        }

        .contact-section h1 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        /* Underline */
        .line {
            width: 150px;
            height: 4px;
            background-color: #08c5e9;
            margin: 15px auto;
        }

        .contact-section p {
            font-size: 18px;
            margin-top: 20px;
        }

        /* Contact Form */
        .contact-form {
            max-width: 700px;
            margin: 50px auto;
            padding: 30px;
            background-color: white;
        }

        .contact-form h2 {
            margin-bottom: 30px;
        }

        .form-control {
            padding: 12px;
        }

        .btn-primary {
            background-color: #1670f9;
            border: none;
            padding: 12px;
        }

        .btn-primary:hover {
            background-color: #0956c5;
        }

        /* Footer */
        footer {
            background-color: #f2f2f2;
            padding: 20px;
            text-align: center;
        }

        footer a {
            text-decoration: none;
            color: #1670f9;
        }

        /* Mobile Responsive */
        @media (max-width: 576px) {

            .contact-section {
                padding: 40px 15px;
            }

            .contact-section h1 {
                font-size: 30px;
            }

            .contact-section p {
                font-size: 16px;
            }

            .contact-form {
                margin: 25px auto;
                padding: 15px;
            }

        }

    </style>

</head>

<body>

    <!-- NAVBAR START -->

    <header>

        <nav class="navbar navbar-expand-lg navbar-dark">

            <div class="container">

                <!-- Logo -->
                <a class="navbar-brand" href="index.html">
                    <img src="image/logo.png" alt="Children's Hope Logo">
                </a>

                <!-- Mobile Toggle Button -->
                <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <!-- Navbar Links -->
                <div class="collapse navbar-collapse" id="navbarNav">

                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link mx-lg-2" href="index.html">
                                Home
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link mx-lg-2" href="myself.html">
                                MyPortfolio
                            </a>
                        </li>

                        <!-- About Us Dropdown -->
                        <li class="nav-item dropdown">

                            <a class="nav-link dropdown-toggle"
                                href="#"
                                id="navbarDropdown"
                                role="button"
                                data-bs-toggle="dropdown"
                                aria-expanded="false">

                                About Us

                            </a>

                            <ul class="dropdown-menu" aria-labelledby="navbarDropdown">

                                <li>
                                    <a class="dropdown-item" href="#">Education</a>
                                </li>

                                <li>
                                    <a class="dropdown-item" href="#">Health</a>
                                </li>

                                <li>
                                    <a class="dropdown-item" href="#">Disability</a>
                                </li>

                                <li>
                                    <a class="dropdown-item" href="#">Community Development</a>
                                </li>

                                <li>
                                    <a class="dropdown-item" href="#">Support Services</a>
                                </li>

                            </ul>

                        </li>

                        <li class="nav-item">
                            <a class="nav-link mx-lg-2" href="contact.html">
                                Contact
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link mx-lg-2" href="Journal.html">
                                Journal
                            </a>
                        </li>

                    </ul>

                </div>

            </div>

        </nav>

    </header>

    <!-- NAVBAR END -->


    <!-- CONTACT HEADING START -->

    <section class="contact-section">

        <div class="container">

            <h1>Contact Us</h1>

            <div class="line"></div>

            <p>We would love to hear from you!</p>

        </div>

    </section>

    <!-- CONTACT HEADING END -->


    <!-- CONTACT FORM START -->

    <section class="container">

        <div class="contact-form">

            <h2 class="text-center">Get In Touch</h2>

            <form>

                <!-- Name -->
                <div class="mb-3">

                    <label class="form-label">Your Name</label>

                    <input type="text"
                        class="form-control"
                        placeholder="Enter your name"
                        required>

                </div>

                <!-- Email -->
                <div class="mb-3">

                    <label class="form-label">Your Email</label>

                    <input type="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required>

                </div>

                <!-- Subject -->
                <div class="mb-3">

                    <label class="form-label">Subject</label>

                    <input type="text"
                        class="form-control"
                        placeholder="Enter subject"
                        required>

                </div>

                <!-- Message -->
                <div class="mb-3">

                    <label class="form-label">Your Message</label>

                    <textarea class="form-control"
                        rows="5"
                        placeholder="Write your message..."
                        required></textarea>

                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary w-100">

                    Send Message

                </button>

            </form>

        </div>

    </section>

    <!-- CONTACT FORM END -->


    <!-- FOOTER START -->

    <footer>

        <p>Children's Hope | All Rights Reserved</p>

        <a href="index.html">Home</a> |

        <a href="Journal.html">Journal</a>

    </footer>

    <!-- FOOTER END -->


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
